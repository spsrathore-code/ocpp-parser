name: Deploy OCPP Suite to GitHub Pages

# Builds the Vite app and publishes dist/ to GitHub Pages on every push to main.
# (Pages must be set to "Build and deployment → Source: GitHub Actions".)

on:
  push:
    branches: [main]
  workflow_dispatch: {}

# Least-privilege token for Pages deployment.
permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; don't cancel an in-progress publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      # `npm install` (not `npm ci`): the committed package-lock.json is generated on
      # Windows, and npm has a known bug (npm/cli#4828) where `npm ci` on Linux skips
      # the platform-specific optional dep @rollup/rollup-linux-x64-gnu, breaking the
      # vite/rollup build. `npm install` re-resolves optional deps for this platform.
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
